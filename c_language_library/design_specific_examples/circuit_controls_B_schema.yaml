metadata:
    name: circuitControls
    type: B
    revision: 0
    format_version: 0.0
    description: 'Converter current controller for EMT/averaged-model DLL packaging -- same control algorithm as circuit_controls_A, but takes v_ac/i_L as plain inputs instead of reading them from hardware ADCs, and returns v_bridge directly instead of converting to a PWM duty cycle (this variant has no real PWM hardware to drive)'
    parent_library: 'Design_specific_examples'
    category: 'element'

IN:
    use: inputs_group
    signals:
        i_ref:
            description: 'Machine-limited current reference'
            type: float
            array: 3
            default: [0.0f, 0.0f, 0.0f]
        i_L:
            description: 'Measured inductor (converter output) current'
            type: float
            array: 3
            default: [0.0f, 0.0f, 0.0f]
        v_ac:
            description: 'Measured AC terminal voltage'
            type: float
            array: 3
            default: [0.0f, 0.0f, 0.0f]
        enable:
            description: 'Enable flag for bridge voltage command'
            type: bool
            default: false
        v_dc:
            description: 'DC bus voltage -- v_bridge cannot exceed +/- this'
            type: float
            default: 0.0f

CONTROLLER_CFG:
    use: config_group
    description: 'AC monitor controller settings'
    signals:
        wDamp:
            description: 'Virtual damping bandwidth (rad/s)'
            type: float
            default: 1e3f
        gDamp:
            description: 'Inverse of virtual damping resistance (1/Ohm)'
            type: float
            default: 4.2f
        kFeedFwd:
            description: 'Feedforward gain on voltage'
            type: float
            default: 1.0f
        kP:
            description: 'Proportional gain for current controller'
            type: float
            default: 10.0f
        kSlowPath:
            description: 'Slow path gain for current controller'
            type: float
            default: 0.0f
        wSlowPath:
            description: 'Slow path bandwidth for current controller'
            type: float
            default: 628.0f
        wOffsetCalibration:
            description: 'Bandwidth to calibrate sensor offset'
            type: float
            default: 62.8f

OUT:
    use: outputs_group
    signals:
        v_bridge:
            description: 'Commanded bridge voltage'
            type: float
            array: 3
            default: [0.0f, 0.0f, 0.0f]
